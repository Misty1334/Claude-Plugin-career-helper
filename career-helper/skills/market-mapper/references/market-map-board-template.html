<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Map Board</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --ink: #25282d;
    --ink-soft: #5a616b;
    --line: #d9dee6;
    --accent: #1a4d8f;
    --accent-soft: #e8eef7;
    --warn-ink: #7a4a00;
    --warn-bg: #fff3df;
    --focus: #b25000;
    font-size: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191d;
      --surface: #21252b;
      --ink: #e6e9ed;
      --ink-soft: #a7aeb8;
      --line: #3a4048;
      --accent: #7aa7dd;
      --accent-soft: #263243;
      --warn-ink: #ffd9a0;
      --warn-bg: #453416;
      --focus: #ffb066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  header { padding: 18px 22px 10px 22px; }
  header h1 { margin: 0 0 2px 0; font-size: 1.35rem; }
  header p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 22px 14px 22px;
    align-items: center;
  }
  button {
    font: inherit;
    font-size: 0.85rem;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) {
    button.primary { color: #16191d; }
  }
  button:focus-visible, [tabindex]:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .status-msg {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
    padding: 0 22px 6px 22px;
  }
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(250px, 1fr);
    gap: 12px;
    padding: 0 22px 26px 22px;
    overflow-x: auto;
    align-items: start;
  }
  .column {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    min-height: 140px;
  }
  .column h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 2px 4px 4px 4px;
    display: flex;
    justify-content: space-between;
    color: var(--ink-soft);
  }
  .column .col-hint { font-size: 0.75rem; color: var(--ink-soft); margin: 0 4px 10px 4px; }
  .column.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .card {
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    background: var(--bg);
    padding: 10px 10px 8px 10px;
    cursor: grab;
  }
  .card:active { cursor: grabbing; }
  .card .org { font-weight: 700; font-size: 0.95rem; margin: 0; }
  .card .overview { color: var(--ink-soft); font-size: 0.85rem; margin: 1px 0 6px 0; }
  .card .meta { font-size: 0.8rem; margin: 2px 0; }
  .card .meta strong { font-weight: 600; }
  .card .tag {
    display: inline-block;
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-radius: 4px;
    padding: 0 6px;
    font-weight: 700;
    font-size: 0.75rem;
    margin-left: 6px;
  }
  .card .controls {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .card .controls button { font-size: 0.75rem; padding: 3px 9px; }
  dialog {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    max-width: 460px;
    width: 92vw;
    padding: 18px;
  }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  dialog h3 { margin: 0 0 12px 0; font-size: 1.05rem; }
  dialog label { display: block; font-size: 0.82rem; font-weight: 600; margin: 10px 0 3px 0; }
  dialog input, dialog select, dialog textarea {
    font: inherit;
    font-size: 0.88rem;
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  dialog textarea { resize: vertical; min-height: 56px; }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Market Map Board</h1>
  <p id="board-meta"></p>
</header>

<div class="toolbar">
  <button class="primary" id="copy-md">Copy watchlist markdown</button>
  <button id="download-md">Download watchlist.md</button>
  <button id="add-card">Add organisation</button>
  <button id="reset-data">Reset to file data</button>
  <button id="recover-md" hidden>Copy unexported changes from the previous board</button>
</div>
<p class="status-msg" id="status-msg" role="status" aria-live="polite"></p>

<main class="board" id="board" aria-label="Market map watchlist board"></main>

<dialog id="edit-dialog">
  <h3 id="edit-title">Edit organisation</h3>
  <form method="dialog" id="edit-form">
    <label for="f-org">Organisation</label>
    <input id="f-org" required>
    <label for="f-overview">Overview</label>
    <input id="f-overview" placeholder="What they do, size band, location">
    <label for="f-priority">Priority</label>
    <select id="f-priority"></select>
    <label for="f-signal-group">Signal group</label>
    <select id="f-signal-group">
      <option value="">None</option>
      <option>Hiring</option>
      <option>Growth</option>
      <option>Investment</option>
      <option>Change</option>
    </select>
    <label for="f-signal">Latest signal</label>
    <input id="f-signal" placeholder="One line of fact, with its source">
    <label for="f-signal-date">Signal date</label>
    <input id="f-signal-date" type="date">
    <label for="f-dm">Decision maker</label>
    <input id="f-dm" placeholder="Name, title (source), or [NOT FOUND]">
    <label for="f-angle">Suggested angle</label>
    <textarea id="f-angle"></textarea>
    <label for="f-checked">Last checked</label>
    <input id="f-checked" type="date">
    <p class="hint">Record only what a public source confirms. Leave a field blank rather than guessing.</p>
    <div class="row">
      <button type="button" id="delete-card">Remove</button>
      <button type="button" id="cancel-edit">Cancel</button>
      <button class="primary" id="save-edit" value="save">Save</button>
    </div>
  </form>
</dialog>

<script id="board-data" type="application/json">
{
  "owner": "{{NAME}}",
  "posture": "{{POSTURE}}",
  "generated": "{{DATE}}",
  "cards": [
    {
      "organisation": "{{ORGANISATION}}",
      "overview": "{{OVERVIEW}}",
      "priority": "{{Act now|Warm|Watch|Quiet}}",
      "signalGroup": "{{Hiring|Growth|Investment|Change or empty string}}",
      "latestSignal": "{{LATEST_SIGNAL_WITH_SOURCE}}",
      "signalDate": "{{YYYY-MM-DD or empty string}}",
      "decisionMaker": "{{NAME, TITLE (source) or [NOT FOUND]}}",
      "angle": "{{SUGGESTED_ANGLE}}",
      "lastChecked": "{{YYYY-MM-DD or empty string}}"
    }
  ]
}
</script>

<script>
(function () {
  'use strict';

  var PRIORITIES = ['Act now', 'Warm', 'Watch', 'Quiet'];
  var HINTS = {
    'Act now': 'A dated hiring signal in your function, or a leadership change that creates one. Take the angle this week.',
    'Warm': 'Growth or investment signals, no direct hiring signal yet. Engage and keep watching.',
    'Watch': 'Similar organisation, no signals in the window. Stays on the map.',
    'Quiet': 'No signals for two updates, or a negative signal. Offered for removal.'
  };
  var STALE_DAYS = 14;

  var rawData = document.getElementById('board-data').textContent;
  var fileData = JSON.parse(rawData);
  // Key browser state to a fingerprint of the embedded data, so a
  // regenerated board never loads stale state saved against old data.
  var fingerprint = 0;
  for (var fi = 0; fi < rawData.length; fi++) {
    fingerprint = ((fingerprint << 5) - fingerprint + rawData.charCodeAt(fi)) | 0;
  }
  var STORAGE_KEY = 'career-helper-market-board:' + fingerprint;
  // A stable key also records the most recent board state and whether it
  // has been exported, so a regenerated board (new fingerprint) can offer
  // the previous board's unexported changes instead of losing them.
  var STABLE_KEY = 'career-helper-market-board:last';
  var GROUPS = ['Hiring', 'Growth', 'Investment', 'Change'];
  var state = load();
  var orphan = findOrphan();

  function findOrphan() {
    try {
      var raw = localStorage.getItem(STABLE_KEY);
      if (!raw) { return null; }
      var last = JSON.parse(raw);
      if (last && last.fingerprint !== fingerprint && last.dirty && last.state) { return last.state; }
    } catch (e) { /* ignore */ }
    return null;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { return JSON.parse(raw); }
    } catch (e) { /* localStorage unavailable: fall back to file data */ }
    return normalise(fileData);
  }
  function normalise(data) {
    // Clone each card so board edits never mutate the fileData snapshot
    // that "Reset to file data" restores.
    var cards = (data.cards || []).filter(function (c) {
      return c.organisation && c.organisation.indexOf('{{') === -1;
    }).map(function (c) {
      var copy = {};
      for (var k in c) {
        if (Object.prototype.hasOwnProperty.call(c, k)) { copy[k] = c[k]; }
      }
      if (PRIORITIES.indexOf(copy.priority) === -1) { copy.priority = 'Watch'; }
      if (GROUPS.indexOf(copy.signalGroup) === -1) { copy.signalGroup = ''; }
      return copy;
    });
    cards.forEach(function (c, i) { c.id = 'card-' + i; });
    return { owner: data.owner, posture: data.posture, generated: data.generated, cards: cards, nextId: cards.length };
  }
  var dirty = false;
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.setItem(STABLE_KEY, JSON.stringify({ fingerprint: fingerprint, dirty: dirty, state: state }));
    } catch (e) { /* ignore */ }
  }
  function markDirty() { dirty = true; }
  function markExported() { dirty = false; save(); }

  var board = document.getElementById('board');
  var statusMsg = document.getElementById('status-msg');
  function announce(text) { statusMsg.textContent = text; }

  // Header text comes from the data block via textContent, so a name or
  // posture containing markup is displayed as text, never interpreted.
  document.getElementById('board-meta').textContent =
    'Owner: ' + (fileData.owner || '[UNKNOWN]') + '. Posture: ' + (fileData.posture || '[UNKNOWN]') +
    '. Generated from market-map.md on ' + (fileData.generated || '[UNKNOWN]') +
    '. The map file remains the source of truth: export your changes back when you finish. ' +
    'Priorities reflect evidence in the signal window, not preference.';

  function signalText(card) {
    if (!card.latestSignal) { return 'No public signals found in the window'; }
    return (card.signalGroup ? card.signalGroup + ': ' : '') + card.latestSignal + (card.signalDate ? ' (' + card.signalDate + ')' : '');
  }

  function isStale(card) {
    if (!card.lastChecked) { return false; }
    var d = new Date(card.lastChecked + 'T23:59:59');
    if (isNaN(d)) { return false; }
    return (new Date() - d) > STALE_DAYS * 24 * 60 * 60 * 1000;
  }

  function render() {
    board.innerHTML = '';
    PRIORITIES.forEach(function (priority) {
      var col = document.createElement('section');
      col.className = 'column';
      col.dataset.priority = priority;
      var cards = state.cards.filter(function (c) { return c.priority === priority; });
      var h = document.createElement('h2');
      h.textContent = priority;
      var count = document.createElement('span');
      count.textContent = String(cards.length);
      count.setAttribute('aria-label', cards.length + ' organisations');
      h.appendChild(count);
      col.appendChild(h);
      var hint = document.createElement('p');
      hint.className = 'col-hint';
      hint.textContent = HINTS[priority];
      col.appendChild(hint);
      var list = document.createElement('div');
      list.className = 'cards';
      cards.forEach(function (card) { list.appendChild(renderCard(card)); });
      col.appendChild(list);
      col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', function () { col.classList.remove('drag-over'); });
      col.addEventListener('drop', function (e) {
        e.preventDefault();
        col.classList.remove('drag-over');
        moveCard(e.dataTransfer.getData('text/plain'), priority);
      });
      board.appendChild(col);
    });
    save();
  }

  function renderCard(card) {
    var el = document.createElement('article');
    el.className = 'card';
    el.draggable = true;
    el.tabIndex = 0;
    el.dataset.id = card.id;
    el.setAttribute('aria-label', card.organisation + ', priority ' + card.priority + (isStale(card) ? ', stale' : ''));

    var org = document.createElement('p');
    org.className = 'org';
    org.textContent = card.organisation;
    el.appendChild(org);

    if (card.overview) {
      var ov = document.createElement('p');
      ov.className = 'overview';
      ov.textContent = card.overview;
      el.appendChild(ov);
    }

    el.appendChild(meta('Signal', signalText(card)));
    if (card.decisionMaker) { el.appendChild(meta('Decision maker', card.decisionMaker)); }
    if (card.angle) { el.appendChild(meta('Angle', card.angle)); }

    var checked = meta('Last checked', card.lastChecked || '[UNKNOWN]');
    if (isStale(card)) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'STALE';
      checked.appendChild(tag);
    }
    el.appendChild(checked);

    var controls = document.createElement('div');
    controls.className = 'controls';
    var idx = PRIORITIES.indexOf(card.priority);
    if (idx > 0) { controls.appendChild(moveButton(card, PRIORITIES[idx - 1], 'Raise')); }
    if (idx < PRIORITIES.length - 1) { controls.appendChild(moveButton(card, PRIORITIES[idx + 1], 'Lower')); }
    var edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.addEventListener('click', function () { openEditor(card.id); });
    controls.appendChild(edit);
    el.appendChild(controls);

    el.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', card.id); });
    el.addEventListener('keydown', function (e) {
      // Only act on keys pressed on the card itself; Enter on a child
      // button already triggers that button and must not double-fire.
      if (e.target !== el) { return; }
      if (e.key === 'Enter') { openEditor(card.id); }
      if (e.key === 'ArrowRight' && idx < PRIORITIES.length - 1) { moveCard(card.id, PRIORITIES[idx + 1]); }
      if (e.key === 'ArrowLeft' && idx > 0) { moveCard(card.id, PRIORITIES[idx - 1]); }
    });
    return el;
  }
  function meta(label, value) {
    var p = document.createElement('p');
    p.className = 'meta';
    var s = document.createElement('strong');
    s.textContent = label + ': ';
    p.appendChild(s);
    p.appendChild(document.createTextNode(value));
    return p;
  }
  function moveButton(card, target, verb) {
    var b = document.createElement('button');
    b.textContent = verb + ': ' + target;
    b.addEventListener('click', function () { moveCard(card.id, target); });
    return b;
  }

  function moveCard(id, priority) {
    var card = state.cards.find(function (c) { return c.id === id; });
    if (!card || card.priority === priority) { return; }
    card.priority = priority;
    markDirty();
    announce(card.organisation + ' moved to ' + priority + '.');
    render();
  }

  // Editor
  var dialog = document.getElementById('edit-dialog');
  var prioritySelect = document.getElementById('f-priority');
  PRIORITIES.forEach(function (p) {
    var o = document.createElement('option');
    o.textContent = p;
    prioritySelect.appendChild(o);
  });
  var editingId = null;

  function openEditor(id) {
    var card = state.cards.find(function (c) { return c.id === id; });
    if (!card) { return; }
    editingId = id;
    document.getElementById('edit-title').textContent = 'Edit: ' + card.organisation;
    document.getElementById('f-org').value = card.organisation;
    document.getElementById('f-overview').value = card.overview || '';
    prioritySelect.value = card.priority;
    document.getElementById('f-signal-group').value = card.signalGroup || '';
    document.getElementById('f-signal').value = card.latestSignal || '';
    document.getElementById('f-signal-date').value = card.signalDate || '';
    document.getElementById('f-dm').value = card.decisionMaker || '';
    document.getElementById('f-angle').value = card.angle || '';
    document.getElementById('f-checked').value = card.lastChecked || '';
    dialog.showModal();
  }

  // Saving goes through the form's submit event so that pressing Enter in
  // a field and clicking Save behave identically, and so the browser's
  // required-field validation runs before anything is persisted.
  document.getElementById('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var card = state.cards.find(function (c) { return c.id === editingId; });
    if (!card) { dialog.close(); return; }
    var org = document.getElementById('f-org').value.trim();
    if (!org) { return; }
    card.organisation = org;
    card.overview = document.getElementById('f-overview').value.trim();
    card.priority = prioritySelect.value;
    card.signalGroup = document.getElementById('f-signal-group').value;
    card.latestSignal = document.getElementById('f-signal').value.trim();
    card.signalDate = document.getElementById('f-signal-date').value;
    card.decisionMaker = document.getElementById('f-dm').value.trim();
    card.angle = document.getElementById('f-angle').value.trim();
    card.lastChecked = document.getElementById('f-checked').value;
    delete card.draft;
    markDirty();
    dialog.close();
    announce('Saved changes to ' + card.organisation + '.');
    render();
  });
  document.getElementById('cancel-edit').addEventListener('click', function () { dialog.close(); });
  document.getElementById('delete-card').addEventListener('click', function () {
    state.cards = state.cards.filter(function (c) { return c.id !== editingId; });
    markDirty();
    dialog.close();
    announce('Organisation removed from the board.');
    render();
  });
  // A new card is a draft until first saved; closing the dialog any other
  // way (Cancel, Escape) discards it rather than exporting a placeholder.
  dialog.addEventListener('close', function () {
    var card = state.cards.find(function (c) { return c.id === editingId; });
    if (card && card.draft) {
      state.cards = state.cards.filter(function (c) { return c.id !== editingId; });
      announce('New organisation discarded.');
      render();
    }
    editingId = null;
  });

  document.getElementById('add-card').addEventListener('click', function () {
    var card = {
      id: 'card-new-' + (state.nextId++),
      organisation: 'Organisation',
      overview: '',
      priority: 'Watch',
      signalGroup: '',
      latestSignal: '',
      signalDate: '',
      decisionMaker: '',
      angle: '',
      lastChecked: '',
      draft: true
    };
    state.cards.push(card);
    render();
    openEditor(card.id);
  });

  document.getElementById('reset-data').addEventListener('click', function () {
    if (confirm('Discard board changes and reload the data generated from market-map.md?')) {
      state = normalise(fileData);
      dirty = false;
      announce('Board reset to the data generated from market-map.md.');
      render();
    }
  });

  // Markdown export in the exact market-map.md Watchlist section format.
  function pad(v) { return v || '[UNKNOWN]'; }
  function cell(v) {
    // Escape pipes and flatten newlines so values survive a markdown
    // table without being silently altered beyond whitespace.
    return String(v == null ? '' : v)
      .replace(/\r?\n+/g, '; ')
      .replace(/\|/g, '\\|')
      .trim();
  }
  function localDate() {
    var d = new Date();
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }
  function toMarkdown(source) {
    var src = source || state;
    var today = localDate();
    var lines = [];
    lines.push('## Watchlist', '');
    lines.push('Exported from the board on ' + today + '. Replace the Watchlist section of market-map.md with this table, and update the Priority line in any organisation detail section whose priority changed.', '');
    lines.push('| # | Organisation | Overview | Latest signal (date) | Decision maker | Suggested angle | Priority | Last checked |');
    lines.push('|:--|:-------------|:---------|:---------------------|:---------------|:----------------|:---------|:-------------|');
    var n = 0;
    PRIORITIES.forEach(function (priority) {
      src.cards.filter(function (c) { return c.priority === priority; }).forEach(function (c) {
        n += 1;
        lines.push('| ' + [String(n), cell(c.organisation), cell(c.overview), cell(signalText(c)), cell(pad(c.decisionMaker)), cell(c.angle || 'Follow and read'), cell(c.priority), cell(pad(c.lastChecked))].join(' | ') + ' |');
      });
    });
    lines.push('', 'Priority reflects evidence in the window, not preference. Quiet rows are offered for removal at the next update. A Last checked of [UNKNOWN] means the next update checks the whole signal window for that organisation.', '');
    return lines.join('\n');
  }

  document.getElementById('copy-md').addEventListener('click', function () {
    var md = toMarkdown();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(function () {
        markExported();
        announce('Watchlist markdown copied. Paste it to Claude and ask it to update your market map.');
      }, function () { fallbackCopy(md); });
    } else {
      fallbackCopy(md);
    }
  });
  var recoverBtn = document.getElementById('recover-md');
  if (orphan) {
    recoverBtn.hidden = false;
    announce('This board was regenerated from a newer map. Changes you made on the previous board were not exported; use the recovery button to copy them.');
  }
  recoverBtn.addEventListener('click', function () {
    var md = toMarkdown(orphan);
    var done = function () {
      recoverBtn.hidden = true;
      orphan = null;
      save();
      announce('Previous board changes copied. Paste them to Claude to merge into your market map.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(done, function () { fallbackCopy(md); done(); });
    } else {
      fallbackCopy(md); done();
    }
  });
  function fallbackCopy(md) {
    var ta = document.createElement('textarea');
    ta.value = md;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); markExported(); announce('Watchlist markdown copied.'); }
    catch (e) { announce('Copy failed. Use Download watchlist.md instead.'); }
    document.body.removeChild(ta);
  }
  document.getElementById('download-md').addEventListener('click', function () {
    var blob = new Blob([toMarkdown()], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'watchlist.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    markExported();
    announce('watchlist.md downloaded. Ask Claude to merge it into market-map.md.');
  });

  render();
})();
</script>
